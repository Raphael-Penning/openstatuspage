# OpenStatusPage split deployment: the public status page, the admin instance
# and the background worker, sharing one PostgreSQL database. Every role runs in
# its own container with its own database role. Only "public" and "admin"
# publish a port, each for its own domain; "worker" and "db" are reachable only
# inside the compose networks. Guide: docs/guide/en/02-installation.md#split-deployment
#
# Networks: "public" holds the public instance and the database, "backend" the
# admin instance, the worker and the database. The public container can reach
# PostgreSQL (with its restricted role) but not the admin or worker container,
# so it cannot bypass the restrictions of the admin proxy host. The reverse
# proxies reach the instances through the published host ports, not through
# these networks. Both networks keep outbound access (SMTP, OIDC, monitoring
# systems, the optional Umami server).
#
# Mail: "postfix" (profile "mail", COMPOSE_PROFILES=mail in .env) is a send-only
# mail server with DKIM, reachable only from the admin and worker containers on
# the internal "mail" network and never published. The public container only
# queues mails, so it is not on that network. Another mail server: set SMTP_*
# in .env and remove MAIL_DOMAIN and "mail" from COMPOSE_PROFILES. Details are
# in compose.yaml and the guide.
#
# Setup (from a clone of the repository, the file needs deploy/postgres/):
#
#   cd deploy/compose
#   cp .env.example .env        # keep the file private: chmod 600 .env
#   # uncomment and set the "Split deployment" variables and the secrets in .env
#   docker compose -f compose.split.yaml up -d
#
# Database roles (deploy/postgres/roles.sql, see docs/security-model.md):
#   public        -> osp_public: login with no table access, only the osp_public
#                    views and the subscription functions. The database init script
#                    creates it when the data volume is created.
#   admin, worker -> osp_app: owns the tables and runs the migrations, but is no
#                    superuser, so the functions the public role may call do not
#                    run as one. Created by the same init script.
#   POSTGRES_USER (openstatuspage) is the superuser of the image; only the init
#   script uses it.
#
# The fixed project name gives the volumes their own names
# (openstatuspage-split_pg), so this file can run next to a single-instance
# compose.yaml on the same host.
name: openstatuspage-split

x-image: &image
  image: ${OSP_IMAGE:-ghcr.io/raphael-penning/openstatuspage}:${OSP_VERSION:-latest}
  restart: unless-stopped
  # Like the Kubernetes example: about 80-100 MB in use, short peaks above that
  # (docs/architecture.md#memory).
  mem_reservation: 128m
  mem_limit: 256m

# Mail settings of the admin and worker containers: SMTP_* from .env win;
# without SMTP_HOST but with MAIL_DOMAIN they send through the postfix service.
x-mail-env: &mail-env
  SMTP_HOST: ${SMTP_HOST:-${MAIL_DOMAIN:+postfix}}
  SMTP_FROM: ${SMTP_FROM:-${MAIL_DOMAIN:+Status <status@${MAIL_DOMAIN}>}}
  MAIL_DKIM_DIR: ${MAIL_DOMAIN:+/mail-dkim}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # No env_file: the database must not receive the application secrets.
    environment:
      POSTGRES_DB: openstatuspage
      POSTGRES_USER: openstatuspage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Read by the init script only, which creates the public and the app role with them.
      POSTGRES_PUBLIC_PASSWORD: ${POSTGRES_PUBLIC_PASSWORD:?set POSTGRES_PUBLIC_PASSWORD in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
    volumes:
      - pg:/var/lib/postgresql/data
      # Runs once, on an empty data volume (see deploy/postgres/init-roles.sh).
      - ../postgres:/osp-postgres:ro
      - ../postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks: [public, backend]
    healthcheck:
      # -h localhost: during its init phase the image accepts socket connections
      # only, so the check passes once the server really listens on TCP.
      test: ["CMD-SHELL", "pg_isready -h localhost -U openstatuspage -d openstatuspage"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The public instance: status page, public API, feeds, subscriptions and health.
  # It never migrates, runs no background tasks and serves no admin routes.
  public:
    <<: *image
    ports:
      - "${PUBLIC_BIND:-127.0.0.1}:${PUBLIC_HOST_PORT:-3000}:3000"
    # Only the database, never admin or worker.
    networks: [public]
    # No env_file: the public instance gets only the settings listed here, not
    # SECRET_KEY, the admin password, the OIDC or the SMTP secrets.
    environment:
      APP_ROLE: public
      HOST: 0.0.0.0
      PORT: "3000"
      WORKER_ENABLED: "false"
      BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      # A hop count is safe while PUBLIC_BIND stays 127.0.0.1; on another
      # address set TRUST_PROXY to the proxy's addresses in .env.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Subscriptions are offered when mails are configured; the worker sends them.
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-${MAIL_DOMAIN:+smtp}}
      SMTP_FROM: ${SMTP_FROM:-${MAIL_DOMAIN:+Status <status@${MAIL_DOMAIN}>}}
      # Optional Umami analytics: the public pages proxy its script and events.
      UMAMI_URL: ${UMAMI_URL:-}
      # Only the key of the subscription links, never SECRET_KEY (it decrypts the
      # monitoring credentials and signs the admin cookies).
      SUBSCRIPTION_TOKEN_KEY: ${SUBSCRIPTION_TOKEN_KEY:?set SUBSCRIPTION_TOKEN_KEY in .env}
      DATABASE_URL: postgres://osp_public:${POSTGRES_PUBLIC_PASSWORD:?set POSTGRES_PUBLIC_PASSWORD in .env}@db:5432/openstatuspage
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # The admin instance: management UI and API, login and OIDC, ingest endpoints,
  # and the public page for previews. Its background tasks are off.
  admin:
    <<: *image
    ports:
      - "${ADMIN_BIND:-127.0.0.1}:${ADMIN_HOST_PORT:-3001}:3000"
    networks: [backend, mail]
    # The rest of .env reaches the admin instance (ADMIN_*, OIDC_*, SMTP_*, ...).
    env_file: .env
    volumes:
      - dkim-public:/mail-dkim:ro
    environment:
      <<: *mail-env
      APP_ROLE: admin
      HOST: 0.0.0.0
      PORT: "3000"
      WORKER_ENABLED: "false"
      BASE_URL: ${ADMIN_BASE_URL:?set ADMIN_BASE_URL in .env}
      # Links in subscriber mails and feeds point to the public page.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      SUBSCRIPTION_TOKEN_KEY: ${SUBSCRIPTION_TOKEN_KEY:?set SUBSCRIPTION_TOKEN_KEY in .env}
      DATABASE_URL: postgres://osp_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}@db:5432/openstatuspage
    depends_on:
      db:
        condition: service_healthy

  # The worker: polling, mails, maintenance, bundles, imports and cleanup. Its
  # HTTP port serves /api/health only and is not published.
  worker:
    <<: *image
    env_file: .env
    volumes:
      - dkim-public:/mail-dkim:ro
    environment:
      <<: *mail-env
      APP_ROLE: worker
      HOST: 0.0.0.0
      PORT: "3000"
      WORKER_ENABLED: "true"
      # Mail links (subscription confirmation, unsubscribe) point to the public page.
      BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      SUBSCRIPTION_TOKEN_KEY: ${SUBSCRIPTION_TOKEN_KEY:?set SUBSCRIPTION_TOKEN_KEY in .env}
      DATABASE_URL: postgres://osp_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}@db:5432/openstatuspage
    depends_on:
      db:
        condition: service_healthy
      # Start after the admin instance has migrated the schema.
      admin:
        condition: service_healthy
    networks: [backend, mail]

  # Send-only mail server (boky/postfix pinned by tag, rspamd signs with DKIM).
  # The same service as in compose.yaml; see the comments there.
  postfix:
    image: boky/postfix:v5.2.1-alpine
    profiles: [mail]
    restart: unless-stopped
    mem_limit: 256m
    # No env_file: the mail server must not receive the application secrets.
    environment:
      ALLOWED_SENDER_DOMAINS: ${MAIL_DOMAIN:-}
      POSTFIX_myhostname: ${MAIL_HOSTNAME:-${MAIL_DOMAIN:-localhost.localdomain}}
      # Relay only for this container and the internal mail network (admin, worker).
      POSTFIX_mynetworks: 127.0.0.0/8 ${MAIL_SUBNET:-172.30.251.0/28}
      POSTFIX_smtpd_tls_security_level: none
      DKIM_AUTOGENERATE: "true"
      DKIM_SELECTOR: ${DKIM_SELECTOR:-mail}
      RELAYHOST: ${MAIL_RELAYHOST:-}
      RELAYHOST_USERNAME: ${MAIL_RELAYHOST_USERNAME:-}
      RELAYHOST_PASSWORD: ${MAIL_RELAYHOST_PASSWORD:-}
    volumes:
      - dkim:/var/lib/rspamd/dkim
      - dkim-public:/mail-dkim
    configs:
      - source: postfix-publish-dkim
        target: /docker-init.d/50-publish-dkim.sh
    networks: [mail, mail-out]

configs:
  # Copies the DKIM public keys (never the private ones) to the volume that the
  # admin and worker containers read read-only.
  postfix-publish-dkim:
    content: |
      set -eu
      mkdir -p /mail-dkim
      for f in /var/lib/rspamd/dkim/*.txt; do
        [ -f "$$f" ] || continue
        cp "$$f" /mail-dkim/
        chmod 0644 "/mail-dkim/$$(basename "$$f")"
      done
      chmod 0755 /mail-dkim

networks:
  public:
  backend:
  # Admin and worker <-> postfix, without a route to the outside. Its own
  # default subnet, so this file can run next to compose.yaml.
  mail:
    internal: true
    ipam:
      config:
        - subnet: ${MAIL_SUBNET:-172.30.251.0/28}
  mail-out:

volumes:
  pg:
  dkim:
  dkim-public:
