# OpenStatusPage with PostgreSQL, using the prebuilt image from the GitHub
# Container Registry. No reverse proxy is included: put your own proxy (nginx,
# Caddy, Traefik, ...) in front of the published port for HTTPS.
#
# Setup (the same commands are in the installation guide):
#
#   1. mkdir openstatuspage && cd openstatuspage
#   2. Download this file as compose.yaml and the settings template as .env:
#        curl -fsSLO https://github.com/Raphael-Penning/openstatuspage/releases/latest/download/compose.yaml
#        curl -fsSL -o .env https://github.com/Raphael-Penning/openstatuspage/releases/latest/download/env.example
#   3. Append generated secrets (keep a copy, they cannot be changed freely):
#        printf 'SECRET_KEY=%s\nPOSTGRES_PASSWORD=%s\n' "$(openssl rand -base64 48)" "$(openssl rand -hex 16)" >> .env
#        chmod 600 .env
#   4. Edit .env: BASE_URL, ADMIN_EMAIL, ADMIN_PASSWORD, MAIL_DOMAIN (and
#      HOST_PORT / TRUST_PROXY for your proxy). The port is published on
#      127.0.0.1 only by default, for a reverse proxy on the same host.
#   5. docker compose up -d
#   6. Publish the DNS records shown in Settings -> Email delivery (SPF, DKIM,
#      DMARC) for the bundled mail server.
#
# Mail: the "postfix" service is a send-only mail server for the notification
# mails (profile "mail", turned on by COMPOSE_PROFILES=mail in .env). It signs
# with DKIM (key generated on first start), is never published on a host port
# and relays only for the internal mail network: the app, and processes on the
# Docker host (use it on a single-tenant host). To use another mail server
# instead, set SMTP_HOST (and SMTP_*) in .env, remove MAIL_DOMAIN and remove
# "mail" from COMPOSE_PROFILES. Needs Docker Compose 2.23.1 or newer (inline
# configs), also without the mail profile.
#
# All settings live in .env next to this file; every option of the
# configuration reference can be set there without editing this file.
# Documentation: https://github.com/Raphael-Penning/openstatuspage/tree/main/docs/guide
#
# The fixed project name below gives the volumes stable names
# (openstatuspage_data, openstatuspage_pg) regardless of the directory.
# "docker compose -p <name>" overrides it, e.g. for a second instance.
name: openstatuspage

services:
  openstatuspage:
    image: ${OSP_IMAGE:-ghcr.io/raphael-penning/openstatuspage}:${OSP_VERSION:-latest}
    restart: unless-stopped
    ports:
      # Localhost only by default: with TRUST_PROXY=1 a client that reaches the
      # port directly, around the proxy, could set its own X-Forwarded-For. To
      # publish on all interfaces (HOST_PORT=3000), set TRUST_PROXY to the
      # proxy's addresses instead of a hop count.
      - "${HOST_PORT:-127.0.0.1:3000}:3000"
    # Every setting from .env reaches the app.
    env_file: .env
    environment:
      # The container always listens on 0.0.0.0:3000; HOST_PORT in .env
      # changes the published address and port instead.
      HOST: 0.0.0.0
      PORT: "3000"
      # Fail early with a clear message instead of starting without a key.
      SECRET_KEY: "${SECRET_KEY:?set SECRET_KEY in .env}"
      # Always points to the db service below (overrides DATABASE_URL from .env).
      DATABASE_URL: postgres://openstatuspage:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/openstatuspage
      # Mail: SMTP_* from .env win. Without SMTP_HOST but with MAIL_DOMAIN the app
      # sends through the bundled postfix service (internal network, no login).
      SMTP_HOST: ${SMTP_HOST:-${MAIL_DOMAIN:+postfix}}
      SMTP_FROM: ${SMTP_FROM:-${MAIL_DOMAIN:+Status <status@${MAIL_DOMAIN}>}}
      # DKIM public keys of the bundled postfix, for the DNS records in the admin portal.
      MAIL_DKIM_DIR: ${MAIL_DOMAIN:+/mail-dkim}
    volumes:
      - data:/data
      # Public keys only: the private keys stay in the postfix service.
      - dkim-public:/mail-dkim:ro
    networks: [default, mail]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # No env_file here: the database must not receive the app's secrets.
    environment:
      POSTGRES_DB: openstatuspage
      POSTGRES_USER: openstatuspage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openstatuspage -d openstatuspage"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Send-only mail server for the notification mails: boky/postfix, a widely
  # used Postfix image (https://github.com/bokysan/docker-postfix), pinned by
  # tag. Postfix relays only for the internal "mail" network (the app and the
  # Docker host, its gateway) and only for senders of MAIL_DOMAIN; rspamd signs
  # with DKIM. Without MAIL_RELAYHOST it delivers directly to the recipients' servers: that needs outbound port 25,
  # a PTR record and the DNS records shown in the admin portal.
  postfix:
    image: boky/postfix:v5.2.1-alpine
    profiles: [mail]
    restart: unless-stopped
    mem_limit: 256m
    # No env_file: the mail server must not receive the app's secrets.
    environment:
      ALLOWED_SENDER_DOMAINS: ${MAIL_DOMAIN:-}
      # Host name used in HELO; should match the PTR record of the sending address.
      POSTFIX_myhostname: ${MAIL_HOSTNAME:-${MAIL_DOMAIN:-localhost.localdomain}}
      # Relay only for this container and the internal mail network (the app,
      # and the Docker host through the network's gateway address).
      POSTFIX_mynetworks: 127.0.0.0/8 ${MAIL_SUBNET:-172.30.250.0/28}
      # The mail network is internal (app and postfix only): no STARTTLS offer,
      # so the app needs no certificate exception.
      POSTFIX_smtpd_tls_security_level: none
      # rspamd keeps the keys in the "dkim" volume; never fall back to OpenDKIM,
      # whose keys would not be persisted.
      DKIM_BACKEND: rspamd
      DKIM_AUTOGENERATE: "true"
      DKIM_SELECTOR: ${DKIM_SELECTOR:-osp}
      # Optional smarthost, e.g. [smtp.example.com]:587, when port 25 is blocked.
      RELAYHOST: ${MAIL_RELAYHOST:-}
      RELAYHOST_USERNAME: ${MAIL_RELAYHOST_USERNAME:-}
      RELAYHOST_PASSWORD: ${MAIL_RELAYHOST_PASSWORD:-}
    volumes:
      # The DKIM key pair, generated on first start. Back it up with the database.
      - dkim:/var/lib/rspamd/dkim
      - dkim-public:/mail-dkim
    healthcheck:
      test: ["CMD", "postfix", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    configs:
      - source: postfix-publish-dkim
        target: /docker-init.d/50-publish-dkim.sh
    # "mail" reaches the app only, "mail-out" is the way to the internet.
    networks: [mail, mail-out]

configs:
  # Runs in the postfix container after the DKIM keys were generated: copies the
  # public keys (never the private ones) to the volume the app reads read-only.
  postfix-publish-dkim:
    content: |
      set -eu
      mkdir -p /mail-dkim
      for f in /var/lib/rspamd/dkim/*.txt; do
        [ -f "$$f" ] || continue
        cp "$$f" /mail-dkim/
        chmod 0644 "/mail-dkim/$$(basename "$$f")"
      done
      chmod 0755 /mail-dkim

networks:
  default:
  # App <-> postfix, without a route to the outside. MAIL_SUBNET must not
  # overlap with another network of the host.
  mail:
    internal: true
    ipam:
      config:
        - subnet: ${MAIL_SUBNET:-172.30.250.0/28}
  mail-out:

volumes:
  data:
  pg:
  dkim:
  dkim-public:
