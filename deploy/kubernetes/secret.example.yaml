# Keys expected in the secret "openstatuspage" (docs/configuration.md). This
# file is NOT applied by kustomization.yaml. Create the secret with
# `kubectl create secret generic openstatuspage --from-literal=...` (see
# kustomization.yaml) or with your secret manager; never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: openstatuspage
  namespace: openstatuspage
type: Opaque
stringData:
  # At least 32 characters, e.g. `openssl rand -base64 48`. Back it up: a new
  # key makes stored monitoring credentials unreadable. The value below is only a
  # placeholder: replace it before applying and never deploy with it.
  SECRET_KEY: change-me-to-a-long-random-value
  # External/managed PostgreSQL (recommended). Leave it out to use SQLite on
  # the volume (then exactly one replica).
  DATABASE_URL: postgres://openstatuspage:change-me@postgres.example.com:5432/openstatuspage
  # First administrator, only created while the database has no user.
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: a-long-password
  # Optional email notifications (docs/notifications.md)
  # SMTP_HOST: smtp.example.com
  # SMTP_PORT: "587"
  # SMTP_USER: status@example.com
  # SMTP_PASSWORD: change-me
  # SMTP_FROM: "Status <status@example.com>"
