# Example deployment of OpenStatusPage on Kubernetes.
# The Helm chart in deploy/helm/openstatuspage is the recommended way; these
# plain manifests remain for setups without Helm.
#
#   1. Create the namespace and the secret (see secret.example.yaml):
#        kubectl apply -f namespace.yaml
#        kubectl -n openstatuspage create secret generic openstatuspage \
#          --from-literal=SECRET_KEY="$(openssl rand -base64 48)" \
#          --from-literal=DATABASE_URL='postgres://openstatuspage:CHANGE-ME@postgres.example.com:5432/openstatuspage' \
#          --from-literal=ADMIN_EMAIL=admin@example.com \
#          --from-literal=ADMIN_PASSWORD='a-long-password'
#   2. Adjust the host in ingress.yaml and BASE_URL in deployment.yaml.
#   3. kubectl apply -k deploy/kubernetes
#
# Update by changing newTag below and applying again.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openstatuspage
labels:
  - pairs:
      app.kubernetes.io/name: openstatuspage
      app.kubernetes.io/instance: openstatuspage
    includeSelectors: true
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
# secret.example.yaml is deliberately not listed: create the secret yourself so
# real credentials never end up in a file in this repository.
images:
  - name: ghcr.io/raphael-penning/openstatuspage
    # Pin a release (X.Y.Z). "latest" = newest stable release, "edge" = current
    # main (not for production; the only tag before the first release).
    newTag: latest
