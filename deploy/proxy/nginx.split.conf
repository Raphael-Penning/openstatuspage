# nginx in front of a split OpenStatusPage deployment on the same host: the
# public instance on the public domain, the admin instance on its own domain.
# The worker is never proxied (its port serves /api/health only).
#
# Install like nginx.conf; replace the domains, the certificate paths and the
# allowed networks of the admin domain.
#
# App settings (scripts/install.sh --mode split writes them):
#   public.env:  BASE_URL=https://status.example.com       PORT=3000 HOST=127.0.0.1 TRUST_PROXY=1
#   admin.env:   BASE_URL=https://status.admin.example.com PORT=3001
#   openstatuspage.env: PUBLIC_BASE_URL=https://status.example.com, HOST=127.0.0.1, TRUST_PROXY=1
# A hop count in TRUST_PROXY is safe only while the ports listen on 127.0.0.1.

server {
    listen 80;
    listen [::]:80;
    server_name status.example.com status.admin.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Public status page.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name status.example.com;

    ssl_certificate     /etc/letsencrypt/live/status.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:osp_tls:10m;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Subscription forms only; no uploads on the public domain.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }
}

# Admin domain: management UI and API, login, OIDC, ingest.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name status.admin.example.com;

    ssl_certificate     /etc/letsencrypt/live/status.admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.admin.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:osp_tls:10m;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Bulk check uploads from monitoring systems may be up to 5 MiB.
    client_max_body_size 6m;

    # Restrict the admin domain to your networks (documentation ranges below:
    # replace them). Monitoring systems that push results need access as well.
    allow 192.0.2.0/24;
    allow 2001:db8::/32;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
