# nginx in front of one OpenStatusPage instance (APP_ROLE=all) on the same host.
#
# Install: copy to /etc/nginx/conf.d/openstatuspage.conf (RHEL) or
# /etc/nginx/sites-available/ plus a link in sites-enabled/ (Debian), replace
# status.example.com and the certificate paths, then: nginx -t && systemctl reload nginx
# Certificates: certbot or any other ACME client, e.g.
#   certbot certonly --webroot -w /var/www/html -d status.example.com
#
# App settings (/etc/openstatuspage/openstatuspage.env or .env):
#   BASE_URL=https://status.example.com
#   HOST=127.0.0.1        the app listens on localhost only
#   TRUST_PROXY=1         one proxy hop; safe only while the app port is not
#                         reachable from outside (HOST=127.0.0.1)
#
# The app compresses its responses and sets Cache-Control, Vary and its own
# security headers (CSP and more): pass them through, do not compress or cache
# again (docs/guide/en/03-reverse-proxy.md).

server {
    listen 80;
    listen [::]:80;
    server_name status.example.com;

    # ACME HTTP-01 challenges (certbot --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name status.example.com;

    ssl_certificate     /etc/letsencrypt/live/status.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:osp_tls:10m;
    ssl_session_tickets off;

    server_tokens off;
    # Only over HTTPS (this server block). The app sets the other security headers.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Bulk check uploads from monitoring systems may be up to 5 MiB.
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replace, do not append: the app trusts one hop (TRUST_PROXY=1).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
