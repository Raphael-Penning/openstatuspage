{{- if include "openstatuspage.createSecret" . }}
{{- $v := .Values }}
{{- $existing := $v.secrets.existingSecret }}
# Created from values because no existing Secret was given for some of them.
# The values are also stored in the Helm release; prefer existing Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openstatuspage.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openstatuspage.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not $existing }}
  {{- range $key, $value := dict "SECRET_KEY" $v.secrets.secretKey "SUBSCRIPTION_TOKEN_KEY" $v.secrets.subscriptionTokenKey "ADMIN_EMAIL" $v.secrets.adminEmail "ADMIN_PASSWORD" $v.secrets.adminPassword "SMTP_PASSWORD" $v.secrets.smtpPassword "OIDC_CLIENT_SECRET" $v.secrets.oidcClientSecret }}
  {{- if $value }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if and $v.database.url (not $v.database.existingSecret) }}
  DATABASE_URL: {{ $v.database.url | b64enc | quote }}
  {{- end }}
  {{- if and $v.split.enabled $v.database.public.url (not $v.database.public.existingSecret) }}
  DATABASE_URL_PUBLIC: {{ $v.database.public.url | b64enc | quote }}
  {{- end }}
{{- end }}
