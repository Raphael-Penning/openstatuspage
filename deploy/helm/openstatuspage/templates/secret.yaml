{{- $v := .Values }}
{{- $existing := $v.secrets.existingSecret }}
{{- if include "openstatuspage.createSecret" . }}
# Created from values because no existing Secret was given for some of them.
# The values are also stored in the Helm release; prefer existing Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openstatuspage.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openstatuspage.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not $existing }}
  {{- range $key, $value := dict "SECRET_KEY" $v.secrets.secretKey "SUBSCRIPTION_TOKEN_KEY" (ternary "" $v.secrets.subscriptionTokenKey $v.split.enabled) "ADMIN_EMAIL" $v.secrets.adminEmail "ADMIN_PASSWORD" $v.secrets.adminPassword "SMTP_PASSWORD" $v.secrets.smtpPassword "OIDC_CLIENT_SECRET" $v.secrets.oidcClientSecret }}
  {{- if $value }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if and $v.database.url (not $v.database.existingSecret) }}
  DATABASE_URL: {{ $v.database.url | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if include "openstatuspage.createPublicSecret" . }}
---
# Split mode: the only chart Secret the public pods reference. It holds no
# other keys, so a node that runs public pods cannot read SECRET_KEY.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openstatuspage.publicSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openstatuspage.componentLabels" (dict "root" . "component" "public") | nindent 4 }}
type: Opaque
data:
  {{- if not $v.secrets.publicExistingSecret }}
  SUBSCRIPTION_TOKEN_KEY: {{ $v.secrets.subscriptionTokenKey | b64enc | quote }}
  {{- end }}
  {{- if and $v.database.public.url (not $v.database.public.existingSecret) }}
  DATABASE_URL_PUBLIC: {{ $v.database.public.url | b64enc | quote }}
  {{- end }}
{{- end }}
