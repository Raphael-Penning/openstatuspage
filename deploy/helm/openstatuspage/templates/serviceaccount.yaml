{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openstatuspage.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openstatuspage.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No token: the app does not use the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
