{{- /* Scales the public-facing Deployment: the public instance in split mode, else the single instance (PostgreSQL only, validated). */}}
{{- if .Values.autoscaling.enabled }}
{{- $ctx := dict "root" . "component" (ternary "public" "app" .Values.split.enabled) }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "openstatuspage.componentName" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openstatuspage.componentLabels" $ctx | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "openstatuspage.componentName" $ctx }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- with .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
    {{- with .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
{{- end }}
