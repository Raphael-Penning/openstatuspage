apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openstatuspage.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openstatuspage.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{- if not (kindIs "invalid" $value) }}
  {{- if ne (toString $value) "" }}
  {{ $key }}: {{ toString $value | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
