/*
 * OpenStatusPage push integration for Icinga 2 (example).
 *
 * 1. Copy openstatuspage-notify.sh to /etc/icinga2/scripts/ (chmod 755).
 * 2. Put URL and token into /etc/icinga2/openstatuspage-notify.env (chmod 640, owner root:nagios
 *    or root:icinga depending on your distribution):
 *        OSP_URL=https://status.example.com/api/ingest/<source-id>/icinga2
 *        OSP_TOKEN=<ingest token of the monitoring source>
 * 3. Copy this file to /etc/icinga2/conf.d/ (or a zone directory), adjust the
 *    apply rules and run `icinga2 daemon -C && systemctl reload icinga2`.
 *
 * See docs/adapters/icinga2.md for details.
 */

object User "openstatuspage" {
  display_name = "OpenStatusPage"
  enable_notifications = true
  states = [ Up, Down, OK, Warning, Critical, Unknown ]
  types = [ Problem, Recovery, DowntimeStart, DowntimeEnd, DowntimeRemoved, Custom ]
}

object NotificationCommand "openstatuspage-host" {
  command = [ ConfigDir + "/scripts/openstatuspage-notify.sh" ]
  env = {
    OSP_CONFIG = ConfigDir + "/openstatuspage-notify.env"
    OSP_TYPE = "host"
    OSP_HOST = "$host.name$"
    OSP_HOST_DISPLAY_NAME = "$host.display_name$"
    OSP_STATE = "$host.state$"
    OSP_STATE_ID = "$host.state_id$"
    OSP_OUTPUT = "$host.output$"
    OSP_TIMESTAMP = "$icinga.timet$"
    OSP_NOTIFICATION_TYPE = "$notification.type$"
    // OSP_INSECURE = "1"   // only for self-signed certificates in trusted networks
  }
}

object NotificationCommand "openstatuspage-service" {
  command = [ ConfigDir + "/scripts/openstatuspage-notify.sh" ]
  env = {
    OSP_CONFIG = ConfigDir + "/openstatuspage-notify.env"
    OSP_TYPE = "service"
    OSP_HOST = "$host.name$"
    OSP_HOST_DISPLAY_NAME = "$host.display_name$"
    OSP_SERVICE = "$service.name$"
    OSP_SERVICE_DISPLAY_NAME = "$service.display_name$"
    OSP_STATE = "$service.state$"
    OSP_STATE_ID = "$service.state_id$"
    OSP_OUTPUT = "$service.output$"
    OSP_TIMESTAMP = "$icinga.timet$"
    OSP_NOTIFICATION_TYPE = "$notification.type$"
  }
}

/*
 * Only send what feeds the status page. This example uses a custom variable;
 * a host/service group or name pattern works just as well.
 */
apply Notification "openstatuspage" to Host {
  command = "openstatuspage-host"
  users = [ "openstatuspage" ]
  // Re-send the current state every 30 minutes while not UP, so the status page
  // recovers from missed notifications. 0 = notify only on changes.
  interval = 30m
  assign where host.vars.statuspage == true
}

apply Notification "openstatuspage" to Service {
  command = "openstatuspage-service"
  users = [ "openstatuspage" ]
  interval = 30m
  assign where service.vars.statuspage == true
}
