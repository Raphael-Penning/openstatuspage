<!doctype html>
<!--
  Source of docs/assets/social-preview.png (1280 x 640, GitHub social preview).
  Render it with: node render-social-preview.mjs
  Colours and font follow the app's default theme (apps/web/src/styles.css);
  the logo is the app icon (apps/web/public/favicon.svg). Keep everything
  important at least 80 px away from the edges.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>openstatuspage social preview</title>
<style>
  :root {
    --bg: #f7f7f8;
    --surface: #ffffff;
    --border: #e4e4e7;
    --text: #18181b;
    --muted: #52525b;
    --accent: #7c6cf2;
    --ok: #15803d;
    --degraded: #a16207;
    --partial: #ea580c;
    --font: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; }
  body {
    background: var(--bg);
    font-family: var(--font);
    color: var(--text);
    position: relative;
    overflow: hidden;
  }
  /* Accent line like the status card on the overview. */
  body::before {
    content: ''; position: absolute; inset: 0 0 auto 0; height: 10px; background: var(--accent);
  }
  .content {
    position: absolute; inset: 80px; /* safe area */
    display: flex; flex-direction: column; justify-content: center; gap: 36px;
  }
  .brand { display: flex; align-items: center; gap: 32px; }
  .brand img { width: 112px; height: 112px; flex: none; }
  h1 { font-size: 104px; font-weight: 700; letter-spacing: -0.035em; line-height: 1; }
  p.tagline { font-size: 42px; line-height: 1.3; color: var(--muted); max-width: 1040px; font-weight: 500; text-wrap: balance; letter-spacing: -0.01em; }
  /* A 90-day uptime bar as on the status page. */
  .bars { display: flex; gap: 5px; height: 44px; margin-top: 8px; }
  .bars i { flex: 1; border-radius: 3px; background: var(--ok); }
  .bars i.d { background: repeating-linear-gradient(135deg, var(--degraded) 0 4px, #c8891f 4px 8px); }
  .bars i.p { background: repeating-linear-gradient(135deg, var(--partial) 0 4px, #f59e5b 4px 8px); }
</style>
</head>
<body>
  <div class="content">
    <div class="brand">
      <img src="../../../apps/web/public/favicon.svg" alt="">
      <h1>openstatuspage</h1>
    </div>
    <p class="tagline">A self-hosted, open-source status page that keeps your customers informed without exposing your internal infrastructure.</p>
    <div class="bars" aria-hidden="true"></div>
  </div>
  <script>
    // 60 days, a few of them with incidents, like the uptime bars of the app.
    const bars = document.querySelector('.bars');
    for (let i = 0; i < 60; i++) {
      const el = document.createElement('i');
      if (i === 21 || i === 52) el.className = 'd';
      if (i === 38) el.className = 'p';
      bars.append(el);
    }
  </script>
</body>
</html>
