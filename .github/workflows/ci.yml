name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build

  postgres:
    # Runs migrations and the demo seed against PostgreSQL to keep the schema portable,
    # then the PostgreSQL tests of the restricted public role (apps/server/test-pg).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: osp
          POSTGRES_PASSWORD: osp
          POSTGRES_DB: osp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U osp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://osp:osp@localhost:5432/osp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create the public database role
        # Throwaway password of the CI service container only.
        run: psql "$DATABASE_URL" -v public_password=osp_public_ci -f deploy/postgres/roles.sql
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - name: PostgreSQL tests (public role)
        env:
          PG_TEST_URL: postgres://osp:osp@localhost:5432/osp
          PG_TEST_PUBLIC_URL: postgres://osp_public:osp_public_ci@localhost:5432/osp
        run: pnpm --filter @openstatuspage/server test:pg

  helm:
    # Lints and renders the Helm chart (deploy/helm/openstatuspage) for the main
    # value combinations (SQLite, external PostgreSQL, split mode, NetworkPolicy
    # and HPA) and checks key properties of the output: scripts/helm-test.sh.
    # Then validates every render against the Kubernetes API schemas with
    # kubeconform.
    runs-on: ubuntu-latest
    env:
      # kubeconform release, pinned twice: the SHA-256 of the tarball is
      # hard-coded, and so is the SHA-256 of the release's CHECKSUMS file.
      # Both were taken from https://github.com/yannh/kubeconform/releases/tag/v0.8.0.
      # The install step checks the CHECKSUMS file against its pin, the
      # tarball's line in it against KUBECONFORM_SHA256, and the tarball itself
      # against KUBECONFORM_SHA256, so a changed release asset fails the job.
      # To upgrade, update all three values from the new release.
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      KUBECONFORM_CHECKSUMS_SHA256: 235fc6d8801ca0b6dba3ff3d49b8751e27c7ec92f4414fe052b283ec50cca0af
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.2
      - name: Lint, render and check the chart
        # kubeconform is not on the PATH yet, so the script only writes the
        # renders; the next steps validate them.
        run: scripts/helm-test.sh
        env:
          RENDER_DIR: ${{ runner.temp }}/helm-renders
      - name: Install kubeconform
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/kubeconform"
          mkdir -p "$dir"
          cd "$dir"
          base="https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION"
          curl -fsSLo CHECKSUMS "$base/CHECKSUMS"
          curl -fsSLo kubeconform-linux-amd64.tar.gz "$base/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_CHECKSUMS_SHA256  CHECKSUMS" | sha256sum --check --strict
          grep -qx "$KUBECONFORM_SHA256  kubeconform-linux-amd64.tar.gz" CHECKSUMS
          echo "$KUBECONFORM_SHA256  kubeconform-linux-amd64.tar.gz" | sha256sum --check --strict
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          ./kubeconform -v
      - name: Validate the renders with kubeconform
        # Strict (unknown fields fail) against the minimum Kubernetes version of
        # kubeVersion in Chart.yaml, with the default schema location. The chart
        # has no CRDs, so missing schemas are errors (no -ignore-missing-schemas).
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^kubeVersion: *"?>= *v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' deploy/helm/openstatuspage/Chart.yaml)"
          test -n "$version"
          renders="$RUNNER_TEMP/helm-renders"
          ls "$renders"/*.yaml
          "$RUNNER_TEMP/kubeconform/kubeconform" -strict -summary \
            -kubernetes-version "$version" "$renders"

  image-build:
    # Pull requests only: builds the container image (docker/Dockerfile) for
    # linux/amd64 to check that it still builds. Nothing is pushed, so the job
    # gets no write permission; "packages: write" belongs to the "image" job
    # below, which never runs for pull requests.
    if: github.event_name == 'pull_request'
    needs: [check, postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    concurrency:
      # A newer push to a pull request replaces its running build.
      group: image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          # Pull requests read the cache of main but do not write their own.
          cache-from: type=gha
          provenance: false

  image:
    # Pushes to main and version tags only: builds the multi-arch container image
    # (docker/Dockerfile) and publishes it to the GitHub Container Registry, but
    # only after "check" and "postgres" passed. Tags are described in
    # docs/releasing.md. Pull requests use "image-build" above instead, so
    # "packages: write" is never granted to a pull request run.
    if: github.event_name == 'push'
    needs: [check, postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    concurrency:
      # One image build per ref. Builds of main and release tags always finish,
      # so every commit of main gets its sha- tag.
      group: image-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      # "true" when a stable tag is the highest release overall (see "Release
      # channels"); empty for everything else. Used by the "release" job.
      latest: ${{ steps.release.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name
        id: image
        # ghcr.io/<owner>/<repo> in lower case, so forks publish to their own namespace.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Release channels
        id: release
        # For a stable tag vX.Y.Z decide which moving tags it may take: "latest",
        # "X" and "X.Y" only move when this is the highest stable version overall,
        # in its major line or in its minor line. A backport such as v1.4.9 after
        # v2.0.0 therefore gets "1.4.9" and "1.4" but leaves "1" and "latest" alone
        # if a newer 1.x exists. Pre-releases (v1.2.0-rc.1) never take moving tags.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "$TAG is not a stable release tag, only the exact version is published"
            exit 0
          fi
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"
          # A failing API call must fail the job: without the list every tag would look
          # like the highest one and a backport would move "latest".
          refs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref')"
          stable="$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' <<<"${refs//refs\/tags\//}" || true)"
          stable="$(printf '%s\n%s\n' "$stable" "$TAG" | sed '/^$/d' | sort -u -V)"
          highest() { grep -E "^$1" <<<"$stable" | tail -n 1; }
          latest=false; major_tag=false; minor_tag=false
          [[ "$(highest 'v')" == "$TAG" ]] && latest=true
          # 0.x releases get no bare major tag ("0" would mean nothing).
          [[ "$major" != 0 && "$(highest "v$major\\.")" == "$TAG" ]] && major_tag=true
          [[ "$(highest "v$major\\.$minor\\.")" == "$TAG" ]] && minor_tag=true
          {
            echo "latest=$latest"
            echo "major=$major_tag"
            echo "minor=$minor_tag"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Index annotations need a pushed multi-arch image (always the case here).
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.release.outputs.minor == 'true' }}
            type=semver,pattern={{major}},enable=${{ steps.release.outputs.major == 'true' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.title=OpenStatusPage
            org.opencontainers.image.description=Self-hosted status page that keeps your infrastructure private
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          annotations: |
            org.opencontainers.image.title=OpenStatusPage
            org.opencontainers.image.description=Self-hosted status page that keeps your infrastructure private
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  bundle:
    # Installation without containers (docs/guide/en/13-installation-without-containers.md):
    # builds the release tarball openstatuspage-<version>-linux-<arch>.tar.gz with
    # scripts/build-bundle.sh in a node:22-bullseye container (glibc 2.31, so the
    # native modules run on Debian 11+, Ubuntu 22.04+ and RHEL 9+). arm64 is
    # built under QEMU, like the arm64 image. Pull requests build x64 only as a
    # dry run; version tags build both; pushes to main build nothing.
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      matrix:
        arch: ${{ fromJSON(startsWith(github.ref, 'refs/tags/v') && '["x64","arm64"]' || '["x64"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.arch == 'arm64'
      - name: Build the tarball
        env:
          ARCH: ${{ matrix.arch }}
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          if [[ "$IS_TAG" == true ]]; then
            version="${REF_NAME#v}"
          else
            version="$(jq -r .version package.json)-ci.$GITHUB_RUN_NUMBER"
          fi
          platform=linux/amd64
          [[ "$ARCH" == arm64 ]] && platform=linux/arm64
          docker run --rm --platform "$platform" \
            -e COREPACK_ENABLE_DOWNLOAD_PROMPT=0 \
            -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -e OUT_DIR=/src/dist/release \
            -v "$PWD:/src" -w /src node:22-bullseye \
            bash -c 'corepack enable && scripts/build-bundle.sh "$1"' _ "$version"
          ls -l dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.arch }}
          path: dist/release/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  packages:
    # .deb and .rpm packages (nfpm, deploy/bare-metal/nfpm.yaml) from the
    # tarballs, plus SHA256SUMS over everything the release attaches. Also lints
    # the shell scripts of the installation without containers.
    needs: [bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # nfpm release, pinned twice like kubeconform in the "helm" job: the
      # SHA-256 of the tarball and of the release's checksums.txt are hard-coded
      # (taken from https://github.com/goreleaser/nfpm/releases/tag/v2.48.0).
      NFPM_VERSION: v2.48.0
      NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
      NFPM_CHECKSUMS_SHA256: d78f05f5a94dc4231629bc5731baae2ab8062c89b70e70498d95b106f046fd7b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck scripts/install.sh scripts/build-bundle.sh scripts/build-packages.sh \
            deploy/bare-metal/openstatuspage deploy/bare-metal/package/*.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          path: dist/release
          merge-multiple: true
      - name: Install nfpm
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/nfpm"
          mkdir -p "$dir"
          cd "$dir"
          version="${NFPM_VERSION#v}"
          base="https://github.com/goreleaser/nfpm/releases/download/$NFPM_VERSION"
          file="nfpm_${version}_Linux_x86_64.tar.gz"
          curl -fsSLo checksums.txt "$base/checksums.txt"
          curl -fsSLo "$file" "$base/$file"
          echo "$NFPM_CHECKSUMS_SHA256  checksums.txt" | sha256sum --check --strict
          grep -qx "$NFPM_SHA256  $file" checksums.txt
          echo "$NFPM_SHA256  $file" | sha256sum --check --strict
          tar -xzf "$file" nfpm
          echo "$dir" >> "$GITHUB_PATH"
      - name: Build the packages
        run: scripts/build-packages.sh dist/release/*.tar.gz
      - name: Checksums
        run: |
          set -euo pipefail
          cp scripts/install.sh dist/release/install.sh
          cd dist/release
          sha256sum -- *.tar.gz *.deb *.rpm install.sh | tee SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bare-metal-release
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  install-test:
    # Runs scripts/install.sh against the x64 tarball in Debian and Rocky Linux
    # containers with systemd: install (SQLite on Debian; PostgreSQL and the
    # local Postfix on Rocky; the split deployment with PostgreSQL and Postfix
    # on Debian), check /api/health, the services and the mail setup, update,
    # uninstall (data kept), then install and remove the .deb/.rpm package.
    needs: [packages]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian
            image: debian:12
            setup: apt-get update && apt-get install -y --no-install-recommends systemd systemd-sysv dbus ca-certificates curl && rm -rf /var/lib/apt/lists/*
            init: /lib/systemd/systemd
            split: false
            postfix: false
            install_args: ""
            package: apt-get install -y /artifacts/openstatuspage_*_amd64.deb
            remove: apt-get remove -y openstatuspage
          - name: rocky
            image: rockylinux/rockylinux:9
            setup: dnf install -y systemd procps-ng && dnf clean all
            init: /usr/sbin/init
            split: false
            postfix: true
            install_args: --with-postgres --with-postfix --mail-domain example.com
            package: dnf install -y /artifacts/openstatuspage-*.x86_64.rpm
            remove: dnf remove -y openstatuspage
          - name: debian-split
            image: debian:12
            setup: apt-get update && apt-get install -y --no-install-recommends systemd systemd-sysv dbus ca-certificates curl && rm -rf /var/lib/apt/lists/*
            init: /lib/systemd/systemd
            split: true
            postfix: true
            install_args: --mode split --with-postgres --admin-url http://localhost:3001 --with-postfix --mail-domain example.com
            # The packages are tested by the other two entries.
            package: ""
            remove: ""
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bare-metal-release
          path: artifacts
      - name: Start a ${{ matrix.name }} container with systemd
        env:
          IMAGE: ${{ matrix.image }}
          SETUP: ${{ matrix.setup }}
          INIT: ${{ matrix.init }}
        run: |
          set -euo pipefail
          printf 'FROM %s\nRUN %s\nSTOPSIGNAL SIGRTMIN+3\nCMD ["%s"]\n' "$IMAGE" "$SETUP" "$INIT" > Dockerfile.systemd
          docker build -q -t osp-systemd -f Dockerfile.systemd .
          docker run -d --name osp --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw --tmpfs /run --tmpfs /run/lock \
            -v "$PWD/artifacts:/artifacts:ro" osp-systemd
          for i in $(seq 1 30); do
            state="$(docker exec osp systemctl is-system-running 2>/dev/null || true)"
            [[ "$state" == running || "$state" == degraded ]] && break
            sleep 1
          done
          echo "systemd: $state"
      - name: Install from the tarball
        env:
          ARGS: ${{ matrix.install_args }}
          SPLIT: ${{ matrix.split }}
        run: |
          set -euo pipefail
          tarball="$(cd artifacts && ls openstatuspage-*-linux-x64.tar.gz)"
          # shellcheck disable=SC2086
          docker exec osp bash /artifacts/install.sh install --tarball "/artifacts/$tarball" \
            --base-url http://localhost:3000 $ARGS
          if [[ "$SPLIT" == true ]]; then
            docker exec osp systemctl is-active openstatuspage-split.target openstatuspage-public.service \
              openstatuspage-admin.service openstatuspage-worker.service
            docker exec osp systemctl is-enabled openstatuspage-split.target
            docker exec osp curl -fsS http://127.0.0.1:3001/api/health
            docker exec osp stat -c '%a %U %G' /etc/openstatuspage/public.env | grep -x '640 root openstatuspage-public'
            # The public instance's user cannot read the main settings.
            if docker exec osp runuser -u openstatuspage-public -- cat /etc/openstatuspage/openstatuspage.env > /dev/null 2>&1; then
              echo "::error::openstatuspage-public can read openstatuspage.env"
              exit 1
            fi
            if docker exec osp grep -q '^SECRET_KEY=' /etc/openstatuspage/public.env; then
              echo "::error::public.env has SECRET_KEY"
              exit 1
            fi
          else
            docker exec osp systemctl is-active openstatuspage.service
            docker exec osp systemctl is-enabled openstatuspage.service
          fi
          docker exec osp curl -fsS http://127.0.0.1:3000/api/health
          docker exec osp stat -c '%a %U %G' /etc/openstatuspage/openstatuspage.env | grep -x '640 root openstatuspage'
          # A rerun changes nothing and keeps the secret.
          before="$(docker exec osp sha256sum /etc/openstatuspage/openstatuspage.env)"
          # shellcheck disable=SC2086
          docker exec osp bash /artifacts/install.sh install --tarball "/artifacts/$tarball" $ARGS
          [[ "$before" == "$(docker exec osp sha256sum /etc/openstatuspage/openstatuspage.env)" ]]
      - name: Check PostgreSQL
        if: contains(matrix.install_args, '--with-postgres')
        run: |
          set -euo pipefail
          # 15 or newer for security_invoker views (RHEL 9 defaults to 13).
          version="$(docker exec osp runuser -u postgres -- psql -XtAc 'SHOW server_version_num')"
          echo "PostgreSQL $version"
          [[ "$version" -ge 150000 ]]
          docker exec osp grep -q '^DATABASE_URL=postgres://osp_app:' /etc/openstatuspage/openstatuspage.env
      - name: Check the mail server
        if: matrix.postfix
        run: |
          set -euo pipefail
          docker exec osp systemctl is-active opendkim postfix
          # Only the public key, readable by the app, in MAIL_DKIM_DIR.
          docker exec osp grep -q 'p=[A-Za-z0-9+/]' /etc/openstatuspage/dkim/example.com.osp.txt
          docker exec osp runuser -u openstatuspage -- test -r /etc/openstatuspage/dkim/example.com.osp.txt
          if docker exec osp runuser -u openstatuspage -- ls /etc/opendkim/keys/example.com > /dev/null 2>&1; then
            echo "::error::the app user can read the DKIM private key directory"
            exit 1
          fi
          docker exec osp grep -qx 'MAIL_DKIM_DIR=/etc/openstatuspage/dkim' /etc/openstatuspage/openstatuspage.env
          docker exec osp grep -qx 'SMTP_HOST=127.0.0.1' /etc/openstatuspage/openstatuspage.env
          # Postfix accepts senders of the mail domain and refuses others. A bash
          # SMTP dialog up to RCPT TO (no curl: curl-minimal on Rocky lacks SMTP),
          # so no mail is queued.
          cat > smtp-rcpt.sh << 'SH'
          exec 3<> /dev/tcp/127.0.0.1/25
          reply() {
            local line
            while IFS= read -r -t 10 line <&3; do
              line="${line%$'\r'}"
              [[ "$line" =~ ^[0-9]{3}- ]] || { printf '%s\n' "$line"; return; }
            done
          }
          reply > /dev/null
          printf 'EHLO ci.example.com\r\n' >&3; reply > /dev/null
          printf 'MAIL FROM:<%s>\r\n' "$1" >&3; reply > /dev/null
          printf 'RCPT TO:<someone@example.org>\r\n' >&3; reply
          printf 'QUIT\r\n' >&3
          SH
          ok="$(docker exec -i osp bash -s status@example.com < smtp-rcpt.sh)"
          echo "status@example.com: $ok"
          [[ "$ok" == 250* ]]
          refused="$(docker exec -i osp bash -s someone@example.net < smtp-rcpt.sh)"
          echo "someone@example.net: $refused"
          [[ "$refused" == 5* ]]
      - name: Update, uninstall
        env:
          SPLIT: ${{ matrix.split }}
        run: |
          set -euo pipefail
          tarball="$(cd artifacts && ls openstatuspage-*-linux-x64.tar.gz)"
          docker exec osp bash /artifacts/install.sh update --tarball "/artifacts/$tarball"
          if [[ "$SPLIT" == true ]]; then
            docker exec osp systemctl is-active openstatuspage-public.service openstatuspage-admin.service openstatuspage-worker.service
            docker exec osp curl -fsS http://127.0.0.1:3001/api/health
          else
            docker exec osp systemctl is-active openstatuspage.service
          fi
          docker exec osp curl -fsS http://127.0.0.1:3000/api/health
          docker exec osp bash /artifacts/install.sh uninstall
          docker exec osp test ! -e /opt/openstatuspage/app
          docker exec osp test -f /etc/openstatuspage/openstatuspage.env
          docker exec osp test -d /var/lib/openstatuspage
      - name: Install and remove the package
        if: matrix.package != ''
        env:
          PACKAGE: ${{ matrix.package }}
          REMOVE: ${{ matrix.remove }}
        run: |
          set -euo pipefail
          docker exec osp bash -c "$PACKAGE"
          # Never enabled by the package itself.
          if docker exec osp systemctl is-enabled --quiet openstatuspage.service; then
            echo "::error::the package enabled openstatuspage.service"
            exit 1
          fi
          docker exec osp id openstatuspage-public
          docker exec osp /opt/openstatuspage/app/scripts/install.sh node
          docker exec osp systemctl start openstatuspage.service
          for i in $(seq 1 60); do docker exec osp curl -fsS http://127.0.0.1:3000/api/health && break; sleep 1; done
          docker exec osp curl -fsS http://127.0.0.1:3000/api/health
          docker exec osp bash -c "$REMOVE"
          docker exec osp test -f /etc/openstatuspage/openstatuspage.env
      - name: Logs
        if: failure()
        run: docker exec osp journalctl --no-pager -n 300 -u 'openstatuspage*' -u postgresql -u postfix -u opendkim || true

  release:
    # For a version tag: creates (or updates) the GitHub release with generated
    # notes and uploads the Compose deployment files as assets, with the image
    # version pinned to the tag. "releases/latest/download/compose.yaml" thus
    # always serves the newest stable release. It also attaches the files of the
    # installation without containers (tarballs, .deb, .rpm, install.sh and
    # SHA256SUMS from the "packages" job). See docs/releasing.md.
    needs: [image, packages, install-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render release assets
        # compose.yaml defaults to ${OSP_VERSION:-latest} and env.example to
        # OSP_VERSION=latest; the assets pin the version of this tag instead.
        run: |
          ASSETS="$RUNNER_TEMP/release-assets"
          version="${TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a release tag of the form vX.Y.Z[-pre]"
            exit 1
          fi
          mkdir -p "$ASSETS"
          sed "s/\${OSP_VERSION:-latest}/\${OSP_VERSION:-$version}/" \
            deploy/compose/compose.yaml > "$ASSETS/compose.yaml"
          sed "s/^OSP_VERSION=latest\$/OSP_VERSION=$version/" \
            deploy/compose/.env.example > "$ASSETS/env.example"
          # Fail if a template changed and the substitution no longer applies.
          grep -F "\${OSP_VERSION:-$version}" "$ASSETS/compose.yaml"
          grep -x "OSP_VERSION=$version" "$ASSETS/env.example"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bare-metal-release
          path: ${{ runner.temp }}/bare-metal

      - name: Check the bare-metal assets
        # The version inside the tarballs must be the tag, and SHA256SUMS must match.
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bare-metal"
          version="${TAG#v}"
          ls "openstatuspage-$version-linux-x64.tar.gz" "openstatuspage-$version-linux-arm64.tar.gz"
          sha256sum --check --strict SHA256SUMS

      - name: Create or update the release and upload the assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LATEST: ${{ needs.image.outputs.latest == 'true' }}
        run: |
          ASSETS="$RUNNER_TEMP/release-assets"
          prerelease=false
          [[ "$TAG" == *-* ]] && prerelease=true
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --draft=false --prerelease="$prerelease" --latest="$LATEST"
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" \
              --prerelease="$prerelease" --latest="$LATEST"
          fi
          gh release upload "$TAG" "$ASSETS/compose.yaml" "$ASSETS/env.example" --clobber
          gh release upload "$TAG" "$RUNNER_TEMP"/bare-metal/* --clobber

  helm-publish:
    # For a version tag: packages the Helm chart with version and appVersion =
    # the tag without "v" and pushes it as an OCI artifact to
    # ghcr.io/<owner>/charts/openstatuspage. Runs only for tags pushed to this
    # repository (never for pull requests) and only after the image of the same
    # version was published and the chart checks passed. See docs/releasing.md.
    needs: [image, helm]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: helm-publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.2

      - name: Package the chart
        # The default image follows the repository (ghcr.io/<owner>/<repo>, like the
        # "image" job), so a fork's chart points to the fork's image.
        run: |
          version="${TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a release tag of the form vX.Y.Z[-pre]"
            exit 1
          fi
          values=deploy/helm/openstatuspage/values.yaml
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          sed -i "s|^  repository: ghcr.io/raphael-penning/openstatuspage\$|  repository: $image|" "$values"
          # Fail if values.yaml changed and the substitution no longer applies.
          grep -qx "  repository: $image" "$values"
          helm package deploy/helm/openstatuspage --version "$version" --app-version "$version" \
            --destination "$RUNNER_TEMP/chart"
          echo "CHART=$RUNNER_TEMP/chart/openstatuspage-$version.tgz" >> "$GITHUB_ENV"

      - name: Push the chart to the GitHub Container Registry
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "$CHART" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          helm registry logout ghcr.io
