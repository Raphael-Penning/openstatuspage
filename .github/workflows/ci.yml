name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build

  postgres:
    # Runs migrations and the demo seed against PostgreSQL to keep the schema portable,
    # then the PostgreSQL tests of the restricted public role (apps/server/test-pg).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: osp
          POSTGRES_PASSWORD: osp
          POSTGRES_DB: osp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U osp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://osp:osp@localhost:5432/osp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create the public database role
        # Throwaway password of the CI service container only.
        run: psql "$DATABASE_URL" -v public_password=osp_public_ci -f deploy/postgres/roles.sql
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - name: PostgreSQL tests (public role)
        env:
          PG_TEST_URL: postgres://osp:osp@localhost:5432/osp
          PG_TEST_PUBLIC_URL: postgres://osp_public:osp_public_ci@localhost:5432/osp
        run: pnpm --filter @openstatuspage/server test:pg

  image:
    # Builds the container image (docker/Dockerfile). Pull requests only build it
    # (linux/amd64, nothing is pushed). Pushes to main and version tags publish a
    # multi-arch image to the GitHub Container Registry, but only after "check"
    # and "postgres" passed. Tags are described in docs/releasing.md.
    needs: [check, postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    concurrency:
      # One image build per ref. A newer push to a pull request replaces its running
      # build; builds of main and release tags always finish, so every commit of
      # main gets its sha- tag.
      group: image-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      PUSH: ${{ github.event_name == 'push' }}
    outputs:
      # "true" when a stable tag is the highest release overall (see "Release
      # channels"); empty for everything else. Used by the "release" job.
      latest: ${{ steps.release.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Image name
        id: image
        # ghcr.io/<owner>/<repo> in lower case, so forks publish to their own namespace.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Release channels
        id: release
        # For a stable tag vX.Y.Z decide which moving tags it may take: "latest",
        # "X" and "X.Y" only move when this is the highest stable version overall,
        # in its major line or in its minor line. A backport such as v1.4.9 after
        # v2.0.0 therefore gets "1.4.9" and "1.4" but leaves "1" and "latest" alone
        # if a newer 1.x exists. Pre-releases (v1.2.0-rc.1) never take moving tags.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "$TAG is not a stable release tag, only the exact version is published"
            exit 0
          fi
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"
          # A failing API call must fail the job: without the list every tag would look
          # like the highest one and a backport would move "latest".
          refs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref')"
          stable="$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' <<<"${refs//refs\/tags\//}" || true)"
          stable="$(printf '%s\n%s\n' "$stable" "$TAG" | sed '/^$/d' | sort -u -V)"
          highest() { grep -E "^$1" <<<"$stable" | tail -n 1; }
          latest=false; major_tag=false; minor_tag=false
          [[ "$(highest 'v')" == "$TAG" ]] && latest=true
          # 0.x releases get no bare major tag ("0" would mean nothing).
          [[ "$major" != 0 && "$(highest "v$major\\.")" == "$TAG" ]] && major_tag=true
          [[ "$(highest "v$major\\.$minor\\.")" == "$TAG" ]] && minor_tag=true
          {
            echo "latest=$latest"
            echo "major=$major_tag"
            echo "minor=$minor_tag"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          # Index annotations need a pushed multi-arch image.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: ${{ env.PUSH == 'true' && 'manifest,index' || 'manifest' }}
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.release.outputs.minor == 'true' }}
            type=semver,pattern={{major}},enable=${{ steps.release.outputs.major == 'true' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.latest == 'true' }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=OpenStatusPage
            org.opencontainers.image.description=Self-hosted status page that keeps your infrastructure private
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          annotations: |
            org.opencontainers.image.title=OpenStatusPage
            org.opencontainers.image.description=Self-hosted status page that keeps your infrastructure private
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - uses: docker/setup-qemu-action@v4
        if: env.PUSH == 'true'

      - uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          # Pull requests read the cache of main but do not write their own.
          cache-to: ${{ env.PUSH == 'true' && 'type=gha,mode=max' || '' }}
          provenance: ${{ env.PUSH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUSH == 'true' }}

  release:
    # For a version tag: creates (or updates) the GitHub release with generated
    # notes and uploads the Compose deployment files as assets, with the image
    # version pinned to the tag. "releases/latest/download/compose.yaml" thus
    # always serves the newest stable release. See docs/releasing.md.
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Render release assets
        # compose.yaml defaults to ${OSP_VERSION:-latest} and env.example to
        # OSP_VERSION=latest; the assets pin the version of this tag instead.
        run: |
          ASSETS="$RUNNER_TEMP/release-assets"
          version="${TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a release tag of the form vX.Y.Z[-pre]"
            exit 1
          fi
          mkdir -p "$ASSETS"
          sed "s/\${OSP_VERSION:-latest}/\${OSP_VERSION:-$version}/" \
            deploy/compose/compose.yaml > "$ASSETS/compose.yaml"
          sed "s/^OSP_VERSION=latest\$/OSP_VERSION=$version/" \
            deploy/compose/.env.example > "$ASSETS/env.example"
          # Fail if a template changed and the substitution no longer applies.
          grep -F "\${OSP_VERSION:-$version}" "$ASSETS/compose.yaml"
          grep -x "OSP_VERSION=$version" "$ASSETS/env.example"

      - name: Create or update the release and upload the assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LATEST: ${{ needs.image.outputs.latest == 'true' }}
        run: |
          ASSETS="$RUNNER_TEMP/release-assets"
          prerelease=false
          [[ "$TAG" == *-* ]] && prerelease=true
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --draft=false --prerelease="$prerelease" --latest="$LATEST"
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" \
              --prerelease="$prerelease" --latest="$LATEST"
          fi
          gh release upload "$TAG" "$ASSETS/compose.yaml" "$ASSETS/env.example" --clobber
